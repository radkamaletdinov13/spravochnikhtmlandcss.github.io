<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Справочник HTML и CSS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: одна колонка. Сверху прокручиваемые вкладки по темам, ниже выбранная тема: теория, затем примеры: код с комментариями, результат на экране, разбор слов из кода и пояснение. */
:root {
  --bg: #f5f6f3;
  --surface: #ffffff;
  --fg: #1b2320;
  --muted: #5b6760;
  --line: #d8ddd6;
  --accent: #0b7a75;
  --accent-soft: #d6efec;
  --on-accent: #ffffff;
  --code-bg: #101a18;
  --code-fg: #d7e5df;
  --mark: #e8590c;
  --font-body: "Onest", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --font-display: "Unbounded", "Onest", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121816;
    --surface: #1a2220;
    --fg: #e6ece8;
    --muted: #9aa7a0;
    --line: #2d3835;
    --accent: #4fd1c5;
    --accent-soft: #16403c;
    --on-accent: #07201d;
    --code-bg: #0b1110;
    --code-fg: #d7e5df;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121816;
  --surface: #1a2220;
  --fg: #e6ece8;
  --muted: #9aa7a0;
  --line: #2d3835;
  --accent: #4fd1c5;
  --accent-soft: #16403c;
  --on-accent: #07201d;
  --code-bg: #0b1110;
  --code-fg: #d7e5df;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 8px; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(24px, 6vw, 32px); line-height: 1.15; text-wrap: balance; margin: 0 0 8px; }
h2 { font-size: 22px; line-height: 1.25; margin: 0 0 4px; text-wrap: balance; }
p { margin: 0; max-width: 65ch; }
.lead { color: var(--muted); }

code.i { font-family: var(--font-mono); font-size: .88em; background: var(--accent-soft); padding: 1px 6px; border-radius: 4px; overflow-wrap: anywhere; }

.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; -webkit-overflow-scrolling: touch; }
.tab {
  flex: none; font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.tab:focus-visible, .copy:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }

#panel { display: flex; flex-direction: column; gap: 30px; min-width: 0; }
.theory { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-left: 4px solid var(--accent); background: var(--surface); border-radius: 0 8px 8px 0; }

.ex { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ex h3 { margin: 0; font-size: 17px; }
.block { min-width: 0; }
.block-head, .preview-label { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
.block-head span, .preview-label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.copy {
  font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 6px;
  border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer;
}
pre {
  margin: 0; background: var(--code-bg); color: var(--code-fg);
  font-family: var(--font-mono); font-size: 13px; line-height: 1.65;
  padding: 12px 14px; border-radius: 8px; tab-size: 2;
  white-space: pre-wrap; overflow-wrap: anywhere;
}

/* Окно с живым результатом: изолировано, стили примера не влияют на справочник */
.preview-wrap { min-width: 0; }
.preview { border: 2px solid var(--accent); border-radius: 8px; background: #ffffff; overflow-x: auto; }
.hint { font-size: 13px; color: var(--muted); margin-top: 4px; }

/* Разбор слов из кода */
.gloss { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.gloss-title { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
.gloss ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.gloss li { font-size: 15px; line-height: 1.45; }

.note { color: var(--fg); padding-left: 2px; }
.note::before { content: "Как читать: "; font-weight: 600; color: var(--accent); }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="page">
  <header>
    <div class="eyebrow">Шпаргалка</div>
    <h1>Справочник HTML и CSS</h1>
    <p class="lead">Выбери тему. В каждой сначала теория, потом примеры: код с пояснениями прямо в строках, результат на экране и разбор каждого слова из кода.</p>
  </header>
  <div class="tabs" id="tabs" role="tablist" aria-label="Темы"></div>
  <main id="panel"></main>
</div>

<script>
var SECTIONS = [
{
  id: 'basics', title: 'Основы',
  theory: [
    '**HTML** отвечает за смысл (что это: заголовок, список, ссылка). **CSS** отвечает за вид (цвет, размер, место).',
    '**Тег** это команда в угловых скобках, обычно парная: {{<p>}} открывает, {{</p>}} закрывает. **Атрибут** это настройка внутри открывающего тега: {{class="post"}}. Теги вкладываются друг в друга, как матрёшка, и закрываются в обратном порядке.',
    '**Блочные** теги ({{div}}, {{p}}, {{h1}}, {{ul}}) занимают всю ширину и идут с новой строки. **Строчные** ({{span}}, {{a}}, {{b}}, {{i}}) идут в одной строке с текстом. Менять это можно через {{display}}: {{block}}, {{inline}}, {{inline-block}}, {{none}} (скрыть).'
  ],
  examples: [
    { cap: 'Каркас страницы',
      html: `${'<!DOC' + 'TYPE html>'}   <!-- говорит браузеру: это современный HTML -->
<html lang="ru">   <!-- главный тег, внутри лежит вся страница; язык русский -->
<head>   <!-- служебная часть, на экране её не видно -->
  <meta charset="UTF-8">   <!-- кодировка, чтобы русские буквы читались -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">   <!-- страница подстраивается под ширину телефона -->
  <title>Название вкладки</title>   <!-- текст на вкладке браузера -->
  <link rel="stylesheet" href="style.css">   <!-- подключаем файл со стилями -->
</head>
<body>   <!-- видимая часть страницы -->
  Всё, что видно на странице
</body>
</html>`,
      demo: { html: 'Всё, что видно на странице' },
      note: 'Слева направо внутри: {{html}} содержит {{head}} (служебное) и {{body}} (видимое). Всё, что в {{body}}, ты видишь на экране.' },
    { cap: 'Три способа подключить CSS',
      html: `<!-- Способ 1. Отдельный файл (лучший) -->
<link rel="stylesheet" href="style.css">   <!-- подключает файл style.css -->

<!-- Способ 2. Тег style в head -->
<style>
  p { color: red; }   /* все абзацы красные */
</style>

<!-- Способ 3. Атрибут style прямо в теге -->
<p style="color: red;">Текст</p>   <!-- красным станет только этот абзац -->`,
      demo: { html: '<p>Абзац стал красным, каким бы из трёх способов это ни было написано.</p>', css: 'p { color: red; }' },
      note: 'Лучше файл: он один на все страницы. Если стили спорят, побеждает тот, что ближе к тегу (способ 3). Среди селекторов {{id}} сильнее {{class}}, {{class}} сильнее тега.' },
    { cap: 'Селекторы: как выбрать, что красить',
      html: `<h1>Заголовок</h1>
<h2>Подзаголовок</h2>
<p>Обычный абзац</p>
<div id="header">id="header"</div>   <!-- id: имя для одного блока -->
<div class="post">class="post"</div>   <!-- class: имя для группы блоков -->
<nav><a href="#">Ссылка в nav</a></nav>
<a href="#">Ссылка вне nav</a>`,
      css: `p { color: green; }   /* по тегу: все абзацы зелёные */
.post { background: #ffe58a; padding: 6px; }   /* точка: все с class="post" */
#header { background: #1f2d3d; color: #fff; padding: 6px; }   /* решётка: один блок с id="header" */
nav a { color: red; }   /* пробел значит «внутри»: только ссылки в nav */
h1, h2 { color: purple; }   /* запятая значит «и»: оба заголовка */
a:hover { background: #ffd1dc; }   /* двоеточие: состояние, здесь «навели» */`,
      hint: 'Наведи на любую ссылку или нажми на неё: сработает a:hover.',
      note: 'Вторая ссылка осталась обычной, потому что правило {{nav a}} касается только ссылок внутри {{nav}}.' }
  ]
},
{
  id: 'div', title: 'div, id, class',
  theory: [
    '{{div}} это блочная коробка без смысла: она группирует и оформляет. {{span}} это такая же коробка, но строчная, для куска текста внутри строки.',
    '**id** даёт имя одному блоку (в CSS {{#имя}}), на странице оно не повторяется. **class** даёт имя группе блоков (в CSS {{.имя}}), его можно использовать сколько угодно раз. Сомневаешься, выбирай class. В имени нет пробелов.'
  ],
  examples: [
    { cap: 'div и span',
      html: `<div class="card">   <!-- коробка-карточка -->
  <h3>Товар</h3>   <!-- заголовок внутри карточки -->
  <p>Цена: <span class="price">500 ₽</span></p>   <!-- span выделяет только цену -->
</div>`,
      css: `.card {
  border: 1px solid #ccc;   /* тонкая серая рамка вокруг карточки */
  padding: 15px;            /* отступ от рамки до текста внутри */
}
.price {
  color: red;               /* красный текст */
  font-weight: bold;        /* жирный шрифт */
}`,
      note: '{{div}} с рамкой группирует заголовок и текст. {{span}} красит только цену, а текст вокруг остаётся прежним.' },
    { cap: 'id для одного, class для многих',
      html: `<div id="header">Шапка (одна)</div>   <!-- id: такой блок один на странице -->
<div class="post">Пост 1</div>   <!-- class: можно повторять -->
<div class="post">Пост 2</div>   <!-- тот же класс, то же оформление -->`,
      css: `#header {                      /* решётка: красим блок с id="header" */
  background: #1f2d3d;          /* тёмный фон */
  color: #fff;                  /* белый текст */
  padding: 8px;                 /* отступ внутри */
}
.post {                         /* точка: красим все блоки с class="post" */
  border: 1px solid #3b82c4;    /* синяя рамка */
  padding: 8px;                 /* отступ внутри */
  margin: 6px 0;                /* зазор снаружи: 6px сверху и снизу, 0 по бокам */
}`,
      note: 'Три блока, но правил два. Оба поста получили рамку из одного правила {{.post}}.' }
  ]
},
{
  id: 'text', title: 'Текст',
  theory: [
    'Заголовки {{h1}}–{{h6}}: {{h1}} один на странице, дальше по порядку. Размер меняется в CSS, а тег выбирают по смыслу.',
    'Жирный и курсив бывают двух видов: **по смыслу** ({{strong}}, {{em}}) и **просто вид** ({{b}}, {{i}}). Выглядят одинаково.'
  ],
  examples: [
    { cap: 'Заголовки и абзацы',
      html: `<h1>Главный заголовок</h1>   <!-- самый крупный, один на странице -->
<h2>Раздел</h2>   <!-- уровнем ниже -->
<p>Абзац текста.<br>Новая строка внутри абзаца.</p>   <!-- br переносит строку -->
<hr>   <!-- горизонтальная линия -->
<p>Ещё абзац после линии.</p>`,
      note: 'У {{br}} и {{hr}} закрывающего тега нет: они сами по себе, внутри них ничего не лежит.' },
    { cap: 'Жирный, курсив и другое: теги',
      html: `<strong>Важное</strong>   <b>Жирное</b><br>   <!-- strong по смыслу, b просто жирный -->
<em>С акцентом</em>   <i>Курсив</i><br>   <!-- em по смыслу, i просто курсив -->
<u>Подчёркнутое</u>   <s>Зачёркнутое</s><br>
<mark>Маркер</mark>   H<sub>2</sub>O   x<sup>2</sup>   <!-- sub вниз, sup вверх -->`,
      note: 'Пары {{strong}} и {{b}}, {{em}} и {{i}} выглядят одинаково, но читалки для слепых читают {{strong}} и {{em}} с выделением.' },
    { cap: 'То же самое через CSS',
      html: `<p class="bold">Жирный через CSS</p>   <!-- класс bold -->
<p class="italic">Курсив через CSS</p>   <!-- класс italic -->
<p class="under">Подчёркнутый через CSS</p>   <!-- класс under -->
<h2 class="big">Заголовок по центру</h2>   <!-- класс big -->`,
      css: `.bold   { font-weight: bold; }          /* жирный */
.italic { font-style: italic; }          /* курсив */
.under  { text-decoration: underline; }  /* подчёркивание */
.big {
  font-size: 28px;           /* размер букв 28 пикселей */
  color: #1f2d3d;            /* тёмно-синий цвет текста */
  text-align: center;        /* текст по центру блока */
}`,
      note: 'Через CSS можно оформить любой тег и не думать о его смысле.' }
  ]
},
{
  id: 'lists', title: 'Списки',
  theory: [
    '{{ul}} это список с точками, {{ol}} нумерованный, {{li}} один пункт. {{li}} всегда лежит внутри {{ul}} или {{ol}}. Список можно вложить в пункт другого списка.'
  ],
  examples: [
    { cap: 'Обычный и нумерованный',
      html: `<ul>   <!-- список с точками -->
  <li>Яблоко</li>   <!-- один пункт -->
  <li>Груша</li>
</ul>

<ol>   <!-- нумерованный список -->
  <li>Первый шаг</li>
  <li>Второй шаг</li>
</ol>`,
      note: '{{ul}} значит unordered list (без порядка), {{ol}} ordered list (с порядком).' },
    { cap: 'Вложенный список',
      html: `<ul>
  <li>Фрукты   <!-- пункт ещё не закрыт: внутри него будет другой список -->
    <ul>   <!-- вложенный список, внутри li -->
      <li>Яблоко</li>
      <li>Груша</li>
    </ul>
  </li>   <!-- теперь пункт «Фрукты» закрыт -->
  <li>Овощи</li>
</ul>`,
      note: 'Внутренний {{ul}} стоит внутри {{li}}, до его закрывающего тега. Браузер сам ставит другой маркер на втором уровне.' },
    { cap: 'Вид маркеров и номеров',
      html: `<ul class="sq">   <!-- класс sq: квадратные маркеры -->
  <li>Квадраты</li>
  <li>Квадраты</li>
</ul>
<ol class="roman">   <!-- класс roman: римские цифры -->
  <li>Римские</li>
  <li>Римские</li>
</ol>
<ol type="a" start="3">   <!-- type: буквы вместо цифр, start: начать с третьей -->
  <li>Буквы с третьей</li>
  <li>Буквы с третьей</li>
</ol>`,
      css: `.sq    { list-style-type: square; }       /* маркеры-квадраты */
.roman { list-style-type: upper-roman; }  /* римские цифры I, II, III */`,
      note: 'Другие значения: {{circle}} пустые кружки, {{disc}} точки, {{none}} без маркеров (так делают меню).' }
  ]
},
{
  id: 'spacing', title: 'Отступы',
  theory: [
    'У блока четыре слоя от центра наружу: текст, **padding** (внутри, фон закрашивается), рамка, **margin** (снаружи, зазор до соседей). Запомнить: padding внутри, margin снаружи.'
  ],
  examples: [
    { cap: 'Чем отличаются padding и margin',
      html: `<div class="wrap">   <!-- серая общая коробка -->
  <div class="box">Без отступов</div>
  <div class="box pad">padding: 20px</div>   <!-- два класса: box и pad -->
  <div class="box mar">margin: 20px</div>   <!-- два класса: box и mar -->
</div>`,
      css: `.wrap { background: #ddd; }   /* серый фон общей коробки */
.box {
  background: #3b82c4;   /* синий фон блоков */
  color: #fff;           /* белый текст */
}
.pad { padding: 20px; }  /* отступ ВНУТРИ: синий блок стал толще */
.mar { margin: 20px; }   /* отступ СНАРУЖИ: вокруг блока серый зазор */`,
      note: 'У второго блока вырос он сам (синий толще), потому что padding внутри. У третьего синий блок прежний, но вокруг него серое место: это margin снаружи.' },
    { cap: 'Как записывать',
      html: `<div class="wrap">
  <div class="a">padding: 20px</div>
  <div class="b">padding: 10px 40px</div>
  <div class="c">padding: 10px 20px 30px 40px</div>
</div>`,
      css: `.wrap { background: #ddd; }
.a {
  background: #3b82c4;
  color: #fff;
  margin-bottom: 8px;           /* зазор снизу, чтобы блоки не слипались */
  padding: 20px;                /* одно число: все четыре стороны */
}
.b {
  background: #3b82c4;
  color: #fff;
  margin-bottom: 8px;
  padding: 10px 40px;           /* два числа: верх и низ 10, лево и право 40 */
}
.c {
  background: #3b82c4;
  color: #fff;
  padding: 10px 20px 30px 40px; /* четыре числа по часовой: верх, право, низ, лево */
}`,
      note: 'Так же записывается {{margin}}. Одна сторона отдельно: {{margin-top}}, {{margin-bottom}}.' },
    { cap: 'Блок по центру страницы',
      html: `<div class="page">Страница по центру</div>`,
      css: `* { box-sizing: border-box; }   /* звёздочка: все элементы; padding и рамка входят в ширину */
.page {
  max-width: 260px;       /* ширина не больше 260px */
  margin: 0 auto;         /* сверху и снизу 0, по бокам auto: блок встаёт по центру */
  background: #3b82c4;    /* синий фон */
  color: #fff;            /* белый текст */
  padding: 12px;          /* отступ внутри */
  text-align: center;     /* текст по центру блока */
}`,
      note: '{{margin: 0 auto}} работает, только если у блока задана ширина. {{box-sizing: border-box}} нужен, чтобы 75% + 25% с отступами не вылезали за 100%. Вертикальные margin соседей не складываются: 20px и 20px дадут 20px.' }
  ]
},
{
  id: 'buttons', title: 'Кнопки',

};
var PROPS = {
  'color': 'цвет текста',
  'background': 'фон: цвет (или картинка)',
  'padding': 'отступ ВНУТРИ блока, между его краем и содержимым',

  'margin-top': 'внешний отступ сверху',
  'margin-bottom': 'внешний отступ снизу',
  'border': 'рамка: толщина, вид линии и цвет; none значит «без рамки»',
  'border-radius': 'скругление углов',
  'width': 'ширина блока (в px или %)',
  'max-width': 'наибольшая ширина: дальше блок не растёт',
  'height': 'высота блока',
  'min-width': 'наименьшая ширина',
  'font-size': 'размер шрифта',
  'font-weight': 'толщина шрифта, bold значит жирный',
  'font-style': 'начертание, italic значит курсив',
  'text-align': 'выравнивание текста: left, center, right',
  'text-decoration': 'подчёркивание: underline подчёркивает, none убирает',
  'list-style': 'вид маркеров списка, none убирает их',
  'list-style-type': 'вид маркеров или номеров: square, circle, disc, upper-roman и другие',
  'display: block': 'display: block: блок идёт с новой строки и на всю ширину',

  'flex-wrap': 'wrap: если дети не помещаются в строку, переносить их вниз',
  'flex-direction': 'направление flex: row ряд, column столбец',
  'gap': 'зазор между детьми flex или grid',

};
var SPECIAL = {
  hover: ':hover: состояние «навели курсор или нажали пальцем»',
  media: '@media: правила внутри работают только при условии, например «экран не шире 600px»',
  marker: '::-webkit-details-marker: стрелочка у блока details в Safari',
  star: '*: звёздочка выбирает все элементы страницы',
  child: '>: выбрать только прямого ребёнка, не вложенных глубже'
};

function glossary(ex) {
  var items = [], seen = {};
  function add(name, text) {
    if (seen[name]) return;
    seen[name] = true;
    items.push([name, text]);
  }
  var html = (ex.html || '').replace(/<!--[\s\S]*?-->/g, '');
  var css = (ex.css || '').replace(/\/\*[\s\S]*?\*\//g, '');

  // HTML: теги и атрибуты
  var tags = html.match(/<[a-z][^>]*>/gi) || [];
  tags.forEach(function (t) {
    var m = t.match(/^<([a-z][a-z0-9]*)/i);
    if (m && TAGS[m[1].toLowerCase()]) add('<' + m[1].toLowerCase() + '>', TAGS[m[1].toLowerCase()]);
  });
  tags.forEach(function (t) {
    var re = /\s([a-z-]+)(?==|\s|>|$)/gi, a;
    while ((a = re.exec(t)) !== null) {
      var n = a[1].toLowerCase();
      if (ATTRS[n]) add(n + '="…"', ATTRS[n]);
    }
  });

  // CSS: особые селекторы и at-правила
  if (/:hover/.test(css)) add(':hover', SPECIAL.hover.split(': ').slice(1).join(': '));
  if (/@media/.test(css)) add('@media', SPECIAL.media.split(': ').slice(1).join(': '));
  if (/::-webkit-details-marker/.test(css)) add('::-webkit-details-marker', SPECIAL.marker.split(': ').slice(1).join(': '));
  if (/(^|\n)\s*\*\s*\{/.test(css)) add('*', SPECIAL.star.split(': ').slice(1).join(': '));
  if (/[a-z-]\s*>\s*[a-z]/i.test(css.replace(/\{[^}]*\}/g, '{}'))) add('>', SPECIAL.child.split(': ').slice(1).join(': '));

  // CSS: свойства
  var re2 = /([a-z-]+)\s*:\s*([^;{}]+)(?=;|\})/gi, m2;
  while ((m2 = re2.exec(css)) !== null) {
    var prop = m2[1].toLowerCase(), val = m2[2].trim().toLowerCase();
    var keyed = prop + ': ' + val;
    if (PROPS[keyed]) {
      add(keyed, PROPS[keyed].replace(keyed + ': ', ''));
    } else if (PROPS[prop]) {
      add(prop, PROPS[prop]);
    }
  }
  return items;
}

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function fmt(s) {
  return esc(s)
    .replace(/\{\{(.+?)\}\}/g, '<code class="i">$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}
function el(tag, cls, html) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}

function codeBlock(label, text) {
  var wrap = el('div', 'block');
  var head = el('div', 'block-head');
  head.appendChild(el('span', null, label));
  var btn = el('button', 'copy', 'Копировать');
  btn.type = 'button';
  head.appendChild(btn);
  var pre = document.createElement('pre');
  pre.textContent = text;
  wrap.appendChild(head);
  wrap.appendChild(pre);
  btn.addEventListener('click', function () {
    function done(msg) {
      btn.textContent = msg;
      setTimeout(function () { btn.textContent = 'Копировать'; }, 2000);
    }
    function fallback() {
      var r = document.createRange();
      r.selectNodeContents(pre);
      var s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
      done('Выделено, скопируй вручную');
    }
    try {
      navigator.clipboard.writeText(text).then(function () { done('Скопировано'); }, fallback);
    } catch (err) { fallback(); }
  });
  return wrap;
}

var BASE_CSS = ':host { display: block; background: #ffffff; color: #1f2d3d; font: 16px/1.5 Arial, Helvetica, sans-serif; padding: 14px; }\n';

function preview(ex) {
  var demo = ex.demo || { html: ex.html, css: ex.css };
  var wrap = el('div', 'preview-wrap');
  wrap.appendChild(el('div', 'preview-label', 'Как выглядит на сайте'));
  var host = el('div', 'preview');
  if (ex.minH) host.style.minHeight = ex.minH + 'px';
  if (host.attachShadow) {
    var root = host.attachShadow({ mode: 'open' });
    var st = document.createElement('style');
    st.textContent = BASE_CSS + (demo.css || '');
    var stage = document.createElement('div');
    stage.innerHTML = demo.html || '';
    root.appendChild(st);
    root.appendChild(stage);
    // Ссылки в примерах никуда не ведут
    root.addEventListener('click', function (e) {
      var n = e.target;
      while (n && n !== root) {
        if (n.tagName === 'A') { e.preventDefault(); break; }
        n = n.parentNode;
      }
    });
  } else {
    host.textContent = 'Этот браузер не показывает предпросмотр.';
  }
  wrap.appendChild(host);
  if (ex.hint) wrap.appendChild(el('div', 'hint', esc(ex.hint)));
  return wrap;
}

function glossBlock(ex) {
  var items = glossary(ex);
  if (!items.length) return null;
  var box = el('div', 'gloss');
  box.appendChild(el('div', 'gloss-title', 'Что значат слова из кода'));
  var ul = document.createElement('ul');
  items.forEach(function (it) {
    ul.appendChild(el('li', null, '<code class="i">' + esc(it[0]) + '</code> ' + esc(it[1])));
  });
  box.appendChild(ul);
  return box;
}

var panel = document.getElementById('panel');
var tabsBox = document.getElementById('tabs');

function render(id) {
  var sec = null;
  for (var i = 0; i < SECTIONS.length; i++) if (SECTIONS[i].id === id) sec = SECTIONS[i];
  if (!sec) sec = SECTIONS[0];
  var tabs = tabsBox.querySelectorAll('.tab');
  for (var t = 0; t < tabs.length; t++) {
    tabs[t].setAttribute('aria-selected', tabs[t].getAttribute('data-id') === sec.id ? 'true' : 'false');
  }
  panel.innerHTML = '';
  panel.appendChild(el('h2', null, esc(sec.title)));
  var theory = el('div', 'theory');
  sec.theory.forEach(function (p) { theory.appendChild(el('p', null, fmt(p))); });
  panel.appendChild(theory);
  sec.examples.forEach(function (ex) {
    var box = el('div', 'ex');
    box.appendChild(el('h3', null, esc(ex.cap)));
    if (ex.html) box.appendChild(codeBlock('HTML', ex.html));
    if (ex.css) box.appendChild(codeBlock('CSS', ex.css));
    box.appendChild(preview(ex));
    var g = glossBlock(ex);
    if (g) box.appendChild(g);
    box.appendChild(el('p', 'note', fmt(ex.note)));
    panel.appendChild(box);
  });
}

SECTIONS.forEach(function (s) {
  var b = el('button', 'tab', esc(s.title));
  b.type = 'button';
  b.setAttribute('role', 'tab');
  b.setAttribute('data-id', s.id);
  b.addEventListener('click', function () {
    try { location.hash = s.id; } catch (e) {}
    render(s.id);
  });
  tabsBox.appendChild(b);
});

function fromHash() {
  var h = '';
  try { h = (location.hash || '').replace('#', ''); } catch (e) {}
  render(h);
}
window.addEventListener('hashchange', fromHash);
fromHash();
</script>
